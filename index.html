<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-mono min-h-screen">

  <!-- ===== Hero: タスク(左) / 残り日数(中央・主役) / スケジュール(右) — 最初の1画面はこれだけ ===== -->
  <div class="min-h-screen flex flex-col justify-center max-w-6xl mx-auto px-10">

    <p class="text-zinc-500 text-sm tracking-[0.3em] uppercase mb-4 text-center">卒業まで</p>

    <!-- 学年セレクタ: 今何年生かを選ぶと期限が再計算される -->
    <div id="grade-selector" class="flex justify-center gap-2 mb-8">
      <button type="button" data-grade="1" class="grade-btn px-4 py-1.5 text-sm border rounded border-zinc-800 text-zinc-500">1年</button>
      <button type="button" data-grade="2" class="grade-btn px-4 py-1.5 text-sm border rounded border-zinc-800 text-zinc-500">2年</button>
      <button type="button" data-grade="3" class="grade-btn px-4 py-1.5 text-sm border rounded border-zinc-800 text-zinc-500">3年(大学院1年)</button>
      <button type="button" data-grade="4" class="grade-btn px-4 py-1.5 text-sm border rounded border-zinc-800 text-zinc-500">4年(大学院2年)</button>
      
    </div>


    <div class="grid grid-cols-[1fr_34rem_1fr] items-center gap-8">
      <!-- タスク: 追加・完了トグルが可能（localStorageに保存され、再訪問時も復元される） -->
      <div class="h-96 border border-zinc-800 rounded p-4 flex flex-col">
        <div class="flex items-baseline justify-between mb-3">
          <span class="text-zinc-400 text-sm">タスク</span>
          <span id="task-count" class="text-zinc-600 text-xs">-</span>
        </div>
        <ul id="task-list" class="flex-1 overflow-y-auto space-y-1 mb-3"></ul>
        <form id="task-form" class="flex gap-2">
          <input id="task-input" type="text" placeholder="挑戦を追加" autocomplete="off"
            class="flex-1 min-w-0 bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
          <button type="submit" class="px-3 py-1.5 text-sm border border-zinc-700 rounded text-zinc-300 hover:border-orange-500 hover:text-orange-500">追加</button>
        </form>
      </div>

      <!-- 残り日数: 主役（桁数が変わっても幅が動かないよう固定幅カラムの中で中央揃え） -->
      <div class="flex flex-col items-center px-6">
        <div class="flex items-baseline gap-4">
          <span id="remaining-days" class="text-[13rem] leading-none font-bold text-orange-500 tabular-nums">612</span>
          <span class="text-4xl text-zinc-400">日</span>
        </div>
        <p class="mt-6 text-zinc-500 text-xl">
          残り<span id="remaining-weeks" class="text-zinc-300">87</span>週　／　経過<span id="elapsed-ratio" class="text-zinc-300">58%</span>
        </p>
      </div>

      <!-- スケジュール: 期日つきの予定を追加、近い順+残り日数バッジ表示（localStorageに保存され、再訪問時も復元される） -->
      <div class="h-96 border border-zinc-800 rounded p-4 flex flex-col">
        <div class="flex items-baseline justify-between mb-3">
          <span class="text-zinc-400 text-sm">スケジュール</span>
          <span id="schedule-count" class="text-zinc-600 text-xs">-</span>
        </div>
        <ul id="schedule-list" class="flex-1 overflow-y-auto space-y-1 mb-3"></ul>
        <form id="schedule-form" class="flex flex-col gap-2">
          <input id="schedule-title-input" type="text" placeholder="予定を追加" autocomplete="off"
            class="bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
          <div class="flex gap-2">
            <input id="schedule-date-input" type="date"
              class="flex-1 min-w-0 [color-scheme:dark] bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
            <button type="submit" class="px-3 py-1.5 text-sm border border-zinc-700 rounded text-zinc-300 hover:border-orange-500 hover:text-orange-500">追加</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- ===== 二次情報: 指標カード + 週グリッド（スクロールしないと見えない・控えめ表示） ===== -->
  <div class="max-w-6xl mx-auto px-10 pb-14">

    <!-- スクロール追従バー: 縮小版の 残り日数 / タスク / スケジュール -->
    <div class="sticky top-0 z-10 -mx-10 px-10 py-3 mb-10 bg-zinc-950/95 backdrop-blur-sm border-b border-zinc-800">
      <div class="grid grid-cols-[1fr_10rem_1fr] items-center gap-4">
        <div class="h-10 border border-dashed border-zinc-800 rounded flex items-center justify-center">
          <span class="text-zinc-700 text-xs">タスク</span>
        </div>
        <div class="flex items-baseline gap-2 justify-self-center">
          <span id="remaining-days-sticky" class="text-3xl font-bold text-orange-500 tabular-nums leading-none">612</span>
          <span class="text-sm text-zinc-400">日</span>
        </div>
        <div class="h-10 border border-dashed border-zinc-800 rounded flex items-center justify-center">
          <span class="text-zinc-700 text-xs">スケジュール</span>
        </div>
      </div>
    </div>

    <div class="opacity-50 hover:opacity-100 focus-within:opacity-100 transition-opacity duration-300">

    <!-- 指標カード 2x2 -->
    <div class="grid grid-cols-4 gap-3 mb-10 text-sm">
      <div class="border border-zinc-800 rounded px-4 py-3">
        <p class="text-zinc-500 text-xs mb-1">残りの週</p>
        <p id="card-remaining-weeks" class="text-xl text-zinc-200 tabular-nums">-</p>
      </div>
      <div class="border border-zinc-800 rounded px-4 py-3">
        <p class="text-zinc-500 text-xs mb-1">残りの日数</p>
        <p id="card-remaining-days" class="text-xl text-zinc-200 tabular-nums">-</p>
      </div>
      <div class="border border-zinc-800 rounded px-4 py-3">
        <p class="text-zinc-500 text-xs mb-1">残りの長期休暇</p>
        <p id="card-remaining-breaks" class="text-xl text-zinc-200 tabular-nums">-</p>
      </div>
      <div class="border border-zinc-800 rounded px-4 py-3">
        <p class="text-zinc-500 text-xs mb-1">経過</p>
        <p id="card-elapsed-ratio" class="text-xl text-zinc-200 tabular-nums">-</p>
      </div>
    </div>

    <!-- 週グリッド -->
    <div id="week-grid" class="grid gap-1 mb-4" style="grid-template-columns: repeat(26, minmax(0, 1fr));"></div>

    <!-- 凡例 -->
    <div class="flex items-center gap-6 text-xs text-zinc-500">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 inline-block bg-zinc-800"></span>経過した週
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 inline-block bg-orange-500"></span>今週
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 inline-block bg-orange-500/20"></span>残りの週
      </div>
    </div>

    </div>

  </div>

<script>
  const MS_PER_DAY = 24 * 60 * 60 * 1000;
  const TOTAL_GRADES = 4;

  function startOfDay(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  // 日本の学年暦（4/1始まり）における「今の学年度が始まった年」を返す
  function academicYearStart(date) {
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    return m >= 4 ? y : y - 1;
  }

  function daysBetween(from, to) {
    return Math.round((startOfDay(to) - startOfDay(from)) / MS_PER_DAY);
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function parseDateInput(value) {
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatDateInput(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // ===== localStorage永続化: ブラウザ＋端末単位で状態を保存する =====
  const STORAGE_KEYS = {
    grade: 'countdown-mock:grade',
    tasks: 'countdown-mock:tasks',
    schedules: 'countdown-mock:schedules',
  };

  function loadJSON(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null; // プライベートモード等で使えない場合は保存なしにフォールバック
    }
  }

  function saveJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      // 保存できない環境では黙って諦める
    }
  }

  function computeProgress(grade, today) {
    const ay = academicYearStart(today);
    const entryDate = new Date(ay - (grade - 1), 3, 1); // 現学年度からgrade-1年遡った4/1
    const graduationDate = new Date(ay + (TOTAL_GRADES - grade) + 1, 2, 31); // 4年目終了年の3/31

    const remainingDays = Math.max(0, daysBetween(today, graduationDate));
    const elapsedDaysTotal = Math.max(0, daysBetween(entryDate, today));
    const totalDaysTotal = Math.max(1, daysBetween(entryDate, graduationDate));

    const totalWeeks = Math.round(totalDaysTotal / 7);
    const elapsedWeeks = Math.min(totalWeeks, Math.floor(elapsedDaysTotal / 7));
    const remainingWeeks = Math.max(0, totalWeeks - elapsedWeeks - 1); // 「今週」を除いた残り
    const elapsedRatio = Math.min(1, elapsedDaysTotal / totalDaysTotal);

    // 残りの長期休暇（夏休み・春休み、それぞれ年2回想定）を卒業までの範囲で数える
    let remainingBreaks = 0;
    for (let i = 0; ay + i <= ay + (TOTAL_GRADES - grade); i++) {
      const summerBreak = new Date(ay + i, 7, 1);
      const springBreak = new Date(ay + i + 1, 1, 1);
      [summerBreak, springBreak].forEach((breakDate) => {
        if (breakDate > startOfDay(today) && breakDate <= graduationDate) {
          remainingBreaks++;
        }
      });
    }

    return {
      entryDate, graduationDate,
      totalWeeks, elapsedWeeks, remainingWeeks,
      remainingDays, remainingBreaks, elapsedRatio,
    };
  }

  function renderGrid(progress) {
    const gridEl = document.getElementById('week-grid');
    gridEl.innerHTML = '';
    for (let i = 0; i < progress.totalWeeks; i++) {
      const cell = document.createElement('div');
      cell.className = 'aspect-square';
      if (i < progress.elapsedWeeks) {
        cell.classList.add('bg-zinc-800');
      } else if (i === progress.elapsedWeeks) {
        cell.classList.add('bg-orange-500');
      } else {
        cell.classList.add('bg-orange-500/20');
      }
      gridEl.appendChild(cell);
    }
  }

  function render(grade) {
    const today = new Date();
    const progress = computeProgress(grade, today);
    const ratioPct = Math.round(progress.elapsedRatio * 100) + '%';

    document.getElementById('remaining-days').textContent = progress.remainingDays;
    document.getElementById('remaining-days-sticky').textContent = progress.remainingDays;
    document.getElementById('remaining-weeks').textContent = progress.remainingWeeks;
    document.getElementById('elapsed-ratio').textContent = ratioPct;

    document.getElementById('card-remaining-weeks').textContent = progress.remainingWeeks;
    document.getElementById('card-remaining-days').textContent = progress.remainingDays;
    document.getElementById('card-remaining-breaks').textContent = progress.remainingBreaks;
    document.getElementById('card-elapsed-ratio').textContent = ratioPct;

    renderGrid(progress);

    document.querySelectorAll('.grade-btn').forEach((btn) => {
      const isActive = Number(btn.dataset.grade) === grade;
      btn.classList.toggle('border-orange-500', isActive);
      btn.classList.toggle('text-orange-500', isActive);
      btn.classList.toggle('border-zinc-800', !isActive);
      btn.classList.toggle('text-zinc-500', !isActive);
    });
  }

  document.querySelectorAll('.grade-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const grade = Number(btn.dataset.grade);
      saveJSON(STORAGE_KEYS.grade, grade);
      render(grade);
    });
  });

  const storedGrade = loadJSON(STORAGE_KEYS.grade);
  render(storedGrade >= 1 && storedGrade <= 4 ? storedGrade : 1);

  // ===== タスク: 追加・完了トグル（localStorageに保存され、再訪問時も復元される） =====
  let tasks = loadJSON(STORAGE_KEYS.tasks) || [
    { id: 'c1', title: 'TOEIC 800点', done: false },
    { id: 'c2', title: '個人開発を1本公開', done: false },
    { id: 'c3', title: '長期インターン', done: true },
  ];

  function renderTasks() {
    const listEl = document.getElementById('task-list');
    listEl.innerHTML = '';
    tasks.forEach((task) => {
      const li = document.createElement('li');
      li.className = 'text-sm px-2 py-1.5 rounded cursor-pointer hover:bg-zinc-900 transition-colors '
        + (task.done ? 'text-zinc-600 line-through' : 'text-zinc-200');
      li.textContent = task.title;
      li.addEventListener('click', () => {
        task.done = !task.done;
        renderTasks();
      });
      listEl.appendChild(li);
    });

    const doneCount = tasks.filter((t) => t.done).length;
    document.getElementById('task-count').textContent = `${tasks.length}件中${doneCount}件達成`;
    saveJSON(STORAGE_KEYS.tasks, tasks);
  }

  document.getElementById('task-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('task-input');
    const title = input.value.trim();
    if (!title) return;
    tasks.unshift({ id: 'c' + Date.now(), title, done: false });
    input.value = '';
    renderTasks();
  });

  renderTasks();

  // ===== スケジュール: 期日つきの予定を追加、近い順+残り日数バッジ（localStorageに保存され、再訪問時も復元される） =====
  const storedSchedules = loadJSON(STORAGE_KEYS.schedules);
  let schedules = storedSchedules
    ? storedSchedules.map((s) => ({ ...s, date: parseDateInput(s.date) }))
    : (() => {
        const scheduleToday0 = startOfDay(new Date());
        return [
          { id: 's1', title: 'TOEIC受験', date: addDays(scheduleToday0, 14) },
          { id: 's2', title: '長期インターン選考', date: addDays(scheduleToday0, 45) },
          { id: 's3', title: 'ゼミ中間発表', date: addDays(scheduleToday0, -3) },
        ];
      })();

  function renderSchedules() {
    const listEl = document.getElementById('schedule-list');
    listEl.innerHTML = '';
    const today0 = startOfDay(new Date());
    const sorted = [...schedules].sort((a, b) => {
      const aOverdue = a.date < today0;
      const bOverdue = b.date < today0;
      if (aOverdue !== bOverdue) return aOverdue ? 1 : -1; // 期限切れは末尾へ
      return aOverdue ? b.date - a.date : a.date - b.date; // 期限切れは新しい順、それ以外は近い順
    });

    sorted.forEach((item) => {
      const daysUntil = daysBetween(today0, item.date);
      const li = document.createElement('li');
      li.className = 'flex items-center justify-between gap-2 text-sm px-2 py-1.5 rounded';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'truncate';
      titleSpan.textContent = item.title;

      const badge = document.createElement('span');
      badge.className = 'text-xs shrink-0 tabular-nums';

      if (daysUntil < 0) {
        li.classList.add('text-zinc-600');
        badge.textContent = '期限切れ';
        badge.classList.add('text-zinc-600');
      } else if (daysUntil === 0) {
        li.classList.add('text-zinc-200');
        badge.textContent = '今日';
        badge.classList.add('text-orange-500', 'font-bold');
      } else {
        li.classList.add('text-zinc-200');
        badge.textContent = `あと${daysUntil}日`;
        badge.classList.add('text-orange-500');
      }

      li.appendChild(titleSpan);
      li.appendChild(badge);
      listEl.appendChild(li);
    });

    document.getElementById('schedule-count').textContent = `${schedules.length}件`;
    saveJSON(STORAGE_KEYS.schedules, schedules.map((s) => ({ ...s, date: formatDateInput(s.date) })));
  }

  document.getElementById('schedule-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const titleInput = document.getElementById('schedule-title-input');
    const dateInput = document.getElementById('schedule-date-input');
    const title = titleInput.value.trim();
    const dateValue = dateInput.value;
    if (!title || !dateValue) return;
    schedules.push({ id: 's' + Date.now(), title, date: parseDateInput(dateValue) });
    titleInput.value = '';
    dateInput.value = '';
    renderSchedules();
  });

  renderSchedules();
</script>

</body>
</html>
