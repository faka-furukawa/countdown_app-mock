<div class="flex items-baseline justify-between mb-3">
  <span class="text-zinc-400 text-sm">タスク</span>
  <span id="task-count" class="text-zinc-600 text-xs">-</span>
</div>
<ul id="task-list" class="flex-1 overflow-y-auto space-y-1 mb-3"></ul>
<form id="task-form" class="flex gap-2">
  <input id="task-input" type="text" placeholder="挑戦を追加" autocomplete="off"
    class="flex-1 min-w-0 bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
  <button type="submit" class="px-3 py-1.5 text-sm border border-zinc-700 rounded text-zinc-300 hover:border-orange-500 hover:text-orange-500">追加</button>
</form>
